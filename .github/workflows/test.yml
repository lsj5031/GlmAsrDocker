name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          # Stop the build if there are Python syntax errors or undefined names
          ruff check server.py --select=E9,F63,F7,F82 --statistics
          # Exit-zero treats all errors as warnings
          ruff check server.py --exit-zero --statistics --select=E,F,W --line-length=127

      - name: Test imports
        run: |
          python -c "from server import app, MODEL_ID, PORT, setup_logging, health; print('All imports successful')"
          python -c "from server import TranscriptionJsonResponse, TranscriptionVerboseJsonResponse, TranscriptionSegment; print('OpenAI parity models import OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify Dockerfile syntax
        run: |
          # Basic Dockerfile validation
          python3 << 'EOF'
          with open('Dockerfile', 'r') as f:
              content = f.read()
              if 'FROM pytorch' in content:
                  print("✓ Dockerfile contains FROM statement")
              if 'HEALTHCHECK' in content:
                  print("✓ HEALTHCHECK configured")
              if 'curl -f' in content:
                  print("✓ HEALTHCHECK uses curl")
              if ' AS ' in content:
                  print("✓ Dockerfile uses uppercase AS")
          EOF
